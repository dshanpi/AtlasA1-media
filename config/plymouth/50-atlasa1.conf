[Unit]
# Enable only when the AtlasA1 theme was explicitly installed. Keep the
# distribution unit's dependency ordering and GDM's normal quit/handoff path.
ConditionKernelCommandLine=
ConditionKernelCommandLine=!plymouth.enable=0
ConditionKernelCommandLine=!nosplash
ConditionPathExists=/etc/plymouth/atlasa1-enabled

[Service]
ExecStart=
ExecStart=/usr/lib/atlasa1/start-plymouth
ExecStartPost=

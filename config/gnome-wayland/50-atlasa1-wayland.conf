[Service]
Environment=LD_LIBRARY_PATH=/opt/atlasa1-img-wayland/runtime-gles
Environment=LIBGL_DRIVERS_PATH=/opt/atlasa1-img-wayland/lib/dri
Environment=COGL_DRIVER=gles2
Environment=GDK_BACKEND=wayland
Environment=GSK_RENDERER=gl
Environment=GDK_DISABLE=gl-api,vulkan
# sunxi-drm vblank queries can block. Submit without the KMS deadline timer.
Environment=MUTTER_DEBUG_KMS_SCHEDULING_PRIORITY=normal
ExecStartPre=/usr/bin/dbus-update-activation-environment --systemd LD_LIBRARY_PATH LIBGL_DRIVERS_PATH COGL_DRIVER GDK_BACKEND GSK_RENDERER GDK_DISABLE
